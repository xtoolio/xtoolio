# nginx site for xtoolio (docs/DEPLOY.md): /etc/nginx/sites-available/xtoolio. HTTP only until certbot adds TLS (and
# with it HTTP/2: browsers allow 6 HTTP/1.1 connections per host and every open tab holds one, the /live stream).
# The app listens on 127.0.0.1:3100 (pm2, ecosystem.config.js) and trusts exactly one proxy hop (web.js trust proxy 1):
# nothing else may sit in front of this without changing that.

upstream xtoolio_app {
  server 127.0.0.1:3100;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  # Set your own domain here (the one APP_ORIGIN and SITE_DOMAIN name).
  server_name example.com www.example.com;

  # Reply pictures: up to 4 photos of 5 MB, or one 15 MB GIF (lib/media.js MEDIA_LIMITS).
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Live updates (Server-Sent Events, GET /live): never buffered, held open (the app pings every 25 s).
  location /live {
    proxy_pass http://xtoolio_app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://xtoolio_app;
  }
}
